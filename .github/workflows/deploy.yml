# Build the archery FRONTEND image (arm64), publish to GHCR, then deploy to the Pi.
# Mirrors the create-resume/game-shop pipeline. Runs on every push to main.
#   1. build-and-push — build linux/arm64 with the same-origin API base baked in,
#      push ghcr.io/axlothecook/archery-club-frontend:latest
#   2. deploy-to-pi    — join the tailnet, SSH to the Pi, pull + restart the stack.
name: Build, publish, and deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          # PUBLIC_API_BASE_URL is a BUILD-TIME SvelteKit public env — baked into the
          # client bundle here so the SPA calls the same-origin /api in production.
          build-args: |
            PUBLIC_API_BASE_URL=https://archery.axlothecook.com/api
          tags: ghcr.io/axlothecook/archery-club-frontend:latest

  deploy-to-pi:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy on the Pi
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PI_TAILSCALE_IP }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          # Raise above the default 10m: pulling a fresh arm64 image + restarting can
          # exceed 10m on the Pi's connection, and a timeout would abort mid-deploy.
          command_timeout: 20m
          script: |
            set -e
            cd ~/archery-club-deploy
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            # Reclaim disk from the image this deploy just replaced. Every deploy leaves
            # the previous :latest dangling; without this they pile up until the disk
            # fills and Postgres crash-loops (No space left on device) → site goes down.
            # Only UNTAGGED/unused images are removed (never the running containers').
            docker image prune -f
            docker builder prune -f
