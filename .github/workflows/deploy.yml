# Build the archery FRONTEND image (arm64), publish to GHCR, then deploy to the Pi.
# Mirrors the create-resume/game-shop pipeline. Runs on every push to main.
#   1. test           — typecheck + unit tests; the gate that stops a broken build
#      reaching prod (a push to main goes straight to the Pi). Mirrors the backend/
#      dashboard gate.
#   2. build-and-push — build linux/arm64, push
#      ghcr.io/axlothecook/archery-club-frontend:latest
#   3. deploy-to-pi    — join the tailnet, SSH to the Pi, pull + restart the stack.
name: Build, publish, and deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Gate: typecheck + unit tests must pass BEFORE we build/deploy. The frontend
  # tests are node-only (no DB, no browser), so this is a lightweight gate —
  # unlike the backend's, it needs no Postgres service.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          path: Archery-club-front-end

      # archery-contracts is a `file:../Archery-contracts` sibling (types-only).
      # npm ci needs it checked out next door to resolve the link.
      - name: Checkout archery-contracts (sibling dep)
        uses: actions/checkout@v5
        with:
          repository: axlothecook/Archery-contracts
          path: Archery-contracts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: Archery-club-front-end
        run: npm ci

      - name: Typecheck
        working-directory: Archery-club-front-end
        run: npm run check

      - name: Unit tests
        working-directory: Archery-club-front-end
        run: npm run test:unit

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/axlothecook/archery-club-frontend:latest

  deploy-to-pi:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # The tailscale action returns as soon as tailscaled is up and authenticated, but
      # the PATH to the Pi (peer discovery / NAT traversal) can take a few more seconds.
      # SSH dialling into that gap failed the deploy with `dial tcp ***:22: i/o timeout`
      # even though the build was fine. Wait for port 22 to actually answer first.
      - name: Wait for the Pi to be reachable over Tailscale
        run: |
          for i in $(seq 1 30); do
            if timeout 5 bash -c "</dev/tcp/${{ secrets.PI_TAILSCALE_IP }}/22" 2>/dev/null; then
              echo "Pi answered on port 22 (attempt $i)"
              exit 0
            fi
            echo "attempt $i/30: no route to the Pi yet, retrying in 5s…"
            sleep 5
          done
          echo "::error::the Pi never became reachable on port 22 over Tailscale (2.5 min)"
          exit 1

      - name: Deploy on the Pi
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PI_TAILSCALE_IP }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          # CONNECT timeout (default 30s). The wait step above means the route is already
          # up, so this is just headroom for a slow handshake — it is NOT the same knob as
          # command_timeout below.
          timeout: 60s
          # Raise above the default 10m: pulling a fresh arm64 image + restarting can
          # exceed 10m on the Pi's connection, and a timeout would abort mid-deploy.
          command_timeout: 20m
          script: |
            set -e
            cd ~/archery-club-deploy
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            # Reclaim disk from the image this deploy just replaced. Every deploy leaves
            # the previous :latest dangling; without this they pile up until the disk
            # fills and Postgres crash-loops (No space left on device) → site goes down.
            # Only UNTAGGED/unused images are removed (never the running containers').
            docker image prune -f
            docker builder prune -f
